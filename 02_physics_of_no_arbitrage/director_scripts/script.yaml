# YAML SCRIPT GENERATION TEMPLATE
# MODULE 2: THE PHYSICS OF NO-ARBITRAGE

module: "02_physics_of_no_arbitrage"
title: "The Physics of No-Arbitrage"
resolution: "1920x1080"
fps: 30

music:
  file: "media/audio/background.mp3"
  volume: 0.1

voice:
  speaker: "Ryan"
  default_instruct: "Professional, educational, measured pace."

scenes:
  # ---------------------------------------------------------
  # SCENE 1: The Confession (Squishing the Sheet)
  # ---------------------------------------------------------
  - id: "scene_1_confession"
    type: animation
    voiceover: >
      In the last module, we proved our neural network could map the option surface. 
      But we cheated. We used an analytical formula to give the network the exact answers. 
      Without that data, the network is blind. It sits in an empty room. It can squish, stretch, and bend... 
      but it has no idea which surface to fit. We have to teach it using only the laws of physics.
    instruct: "Measured, setting up the central conflict."
    manim_class: "EmptyRoom"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 2: The Melting Surface (2D to 3D)
  # ---------------------------------------------------------
  - id: "scene_2_melting"
    type: animation
    voiceover: >
      Let us start at maturity, where time T equals zero. The payoff of our Call option is exactly known. It is this sharp hockey stick. 
      But what happens when we add time? 
      As time to maturity increases, there is more uncertainty. We are more unsure of the final payoff. 
      This uncertainty smooths out the sharp kink into a continuous curve representing the option value. The uncertainty vanishes only when we reach maturity, where we know the payoff exactly.
    instruct: "Descriptive, guiding the visual transition from 2D to 3D."
    manim_class: "TimeExpansion"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 3: The PDE Vectors Stacking
  # ---------------------------------------------------------
  - id: "scene_3_pde_scale"
    type: animation
    voiceover: >
      This smooth surface is governed by the Black Scholes partial differential equation. 
      If we zoom into any arbitrary point, we can extract three vectors. Theta, the time decay. Delta, the directional drift. And Gamma, the diffusion. 
      For the market to be free of arbitrage, these physical forces must balance perfectly. 
      If we stack these three vectors together, they must exactly equal the risk free discount vector on the right. This equation is our physics loss.
    instruct: "Analytical and emphasizing the vector equality."
    manim_class: "PDEScale"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 4: The Hinge (ReLU vs Tanh)
  # ---------------------------------------------------------
  - id: "scene_4_activations"
    type: animation
    voiceover: >
      To calculate those vectors, we need smooth derivatives. 
      If we build a simple model using a ReLU activation function, the resulting prediction will always have a kink. 
      If we roll a point across it, the tangent line snaps. It does not have a single, unique value at the kink, making it impossible to calculate our Greeks. 
      But if we replace ReLU with Tan H, the surface becomes smooth. The tangent has a unique value everywhere, allowing us to extract perfect derivatives.
    instruct: "Instructive, highlighting the mathematical failure of ReLU."
    manim_class: "Activations"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 5: Code Walkthrough
  # ---------------------------------------------------------
  - id: "scene_5_code"
    type: animation
    manim_class: "CodeWalkthroughScene"
    source: "scenes.py"
    voiceover: >
      Let us look at the Python script. First... we scatter random coordinate points across space and time. 
      Next... we ask the network for a prediction, then extract the Delta and Gamma directly from the network weights using Py Torch. 
      Finally... we plug those derivatives into our P D E equation. We penalize the network until the vectors balance perfectly.
    instruct: "Technical but clear and guiding."
    code_file: "code/pinn_black_scholes.py"
    code_range: [46, 100]
    highlights:
      - search_string: "def sample_domain"
        lines_count: 10
      - search_string: "V = model(S, t)"
        lines_count: 15
      - search_string: "pde_residual = dV_dt"
        lines_count: 4

  # ---------------------------------------------------------
  # SCENE 6: PINN Discovery (Animation)
  # ---------------------------------------------------------
  - id: "scene_6_artifact"
    type: animation
    manim_class: "PINNDiscoveryScene"
    source: "scenes.py"
    voiceover: >
      Let us run the optimizer. Starting from our flat orange sheet, the invisible forces of the P D E push and pull the neural network. 
      It discovers the exact option surface without a single piece of training data. 
      Here is your challenge. Open the script, change the boundary condition to a Put option, and watch the physics engine grow an entirely different shape.
    instruct: "Satisfied, conclusive, and challenging."