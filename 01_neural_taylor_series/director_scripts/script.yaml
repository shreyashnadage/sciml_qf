# YAML SCRIPT GENERATION TEMPLATE
# MODULE 1: THE NEURAL TAYLOR SERIES

module: "01_neural_taylor_series"
title: "The Neural Taylor Series"
resolution: "1920x1080"
fps: 30

voice:
  speaker: "Ryan"
  default_instruct: "Professional, educational, measured pace."

scenes:
  # ---------------------------------------------------------
  # SCENE 1A: The Objective Hook
  # ---------------------------------------------------------
  - id: "scene_1a_objective"
    type: animation
    voiceover: >
      In this video, we are going to teach a machine the shape of a financial market without giving it the formula. 
      By replacing rigid, hardcoded equations with flexible, geometric machine learning... we can solve problems that traditional math cannot handle.
    instruct: "Visionary and clear."
    manim_class: "ObjectiveHook"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 1B: The Taylor Wrap
  # ---------------------------------------------------------
  - id: "scene_1b_taylor_wrap"
    type: animation
    voiceover: >
      How does math traditionally solve problems like this? The philosophy behind a Taylor Series is beautiful. 
      If you know everything about a single point, its value, its slope, its acceleration, you can predict what the rest of the function looks like anywhere else. 
      It uses the slope to wrap and guess the rest of the shape. It works beautifully for smooth curves.
    instruct: "Educational, measured pace."
    manim_class: "TaylorWrap"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 1C: The Tangent Panic
  # ---------------------------------------------------------
  - id: "scene_1c_tangent_panic"
    type: animation
    voiceover: >
      But finance does not like smooth curves. Look at this Call Option payoff. At the strike price, we have a catastrophe. 
      It is a sharp, non differentiable corner. A kink. If we try to place our tangent line right on the tip of the corner to do our wrapping trick, the line panics. 
      Because the left side is flat and the right side is angled, it does not know where to balance. 
      Calculus shatters at a kink because there is no single direction. If the math is blind, our risk metrics explode.
    instruct: "Slightly faster, highlighting the conflict and panic."
    manim_class: "TangentPanic"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 2A: The Melting Surface
  # ---------------------------------------------------------
  - id: "scene_2a_melting_surface"
    type: animation
    voiceover: >
      To fix this, we have to stop looking at flat 2D charts and step into the third dimension. 
      Watch what happens as we move backward in time. As time is added to the equation, the sharp, rigid corner of the hockey stick visibly melts. 
      Time and uncertainty act like heat, melting harsh financial realities into smooth probabilities.
    instruct: "Smooth, descriptive, and revealing."
    manim_class: "MeltingSurface"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 2B: The Elastic Sheet
  # ---------------------------------------------------------
  - id: "scene_2b_elastic_sheet"
    type: animation
    voiceover: >
      Here is our true mathematical surface. Now, let us introduce our neural network. 
      Before training, a neural network is nothing more than a flat, random guess. Geometrically, this network is an elastic sheet. 
      The weights control the slope, and the biases control where it folds. Our goal is to mold it.
    instruct: "Instructional and geometric."
    manim_class: "ElasticSheet"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 3A: Architecture Blueprint
  # ---------------------------------------------------------
  - id: "scene_3a_blueprint"
    type: animation
    voiceover: >
      Before we look at the code, let us lay out our structural blueprint. 
      To map the whole environment, our sheet needs to know where it is in space, meaning the stock price and the time remaining. 
      Crucially, it also needs to know Volatility, the heat that determines how much that corner melts.
    instruct: "Conversational, whiteboard explanation."
    manim_class: "ArchitectureBlueprint"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 3B: The Hinge Demonstration
  # ---------------------------------------------------------
  - id: "scene_3b_hinges"
    type: animation
    voiceover: >
      If we just multiply these inputs, our orange sheet stays flat. To make it wrap around our financial surface, we need to add hinges, called Activation Functions. 
      If we use a standard hinge called Re L U, the sheet folds harshly, creating a jagged, rigid mountain peak. But we just learned finance hates sharp corners. 
      We need a hinge that bends metal smoothly, like Tan H. It guarantees our surface has smooth derivatives.
    instruct: "Emphasizing the difference between rigid and smooth."
    manim_class: "HingeDemonstration"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 4A: Code Walkthrough
  # ---------------------------------------------------------
  - id: "scene_4a_code"
    type: animation
    voiceover: >
      Let us look at the Python script and engineer this engine. First, we need an Oracle, a source of ground truth. 
      We ask the analytical Black Scholes formula for the answers so we can train our sheet. 
      Next, we design the neural architecture. Notice we stack linear layers, but we specifically insert our smooth hinge, N N dot Tan H, between them. 
      Finally, we set up our training loop. We calculate the error and tell the optimizer to pull the sheet tighter.
    instruct: "Technical but clear and guiding."
    manim_class: "CodeWalkthrough"
    source: "scenes.py"

  # ---------------------------------------------------------
  # SCENE 4B: Visual Results & Homework (Plotly Artifact)
  # ---------------------------------------------------------
  - id: "scene_4b_artifact"
    type: artifact
    voiceover: >
      Let us run the optimizer and look at the results. The flat orange sheet molds to the uncertainty of the market, perfectly locking onto the true Black Scholes surface. 
      We just taught a machine the exact shape of an option without explicitly programming the formula into its core logic. 
      Here is your challenge. Open the script, change the hinge from Tan H to Re L U, run the visualization, and watch how the derivatives become jagged and useless.
    instruct: "Satisfied, conclusive, and challenging."
    artifact_path: "code/surface_fit.png"
    animation: "fade_in"